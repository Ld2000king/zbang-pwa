name: Daily Realtime Database backup

# Firebase's own automated-backup feature (scheduled exports to Cloud
# Storage) requires the paid Blaze plan - this project deliberately stays on
# the free Spark plan, so this workflow is the free substitute: once a day
# it fetches the ENTIRE Realtime Database as one JSON snapshot and keeps it
# as a downloadable workflow artifact for 90 days.
#
# ONE-TIME SETUP REQUIRED (nothing here works until this is done):
#   1. Firebase Console -> Project Settings (gear icon) -> Service Accounts
#      -> Generate new private key. This downloads a .json file - keep it
#      secret, it grants admin access to the whole Firebase project.
#   2. In this GitHub repo: Settings -> Secrets and variables -> Actions ->
#      New repository secret. Name: FIREBASE_SERVICE_ACCOUNT. Value: paste
#      the ENTIRE contents of that downloaded .json file.
#   3. Also add a secret DATABASE_URL with this project's Realtime Database
#      URL (the same value as databaseURL in firebase-config.js), e.g.
#      https://zbang-royale-default-rtdb.firebaseio.com
#   4. After adding both secrets, run this workflow once by hand (Actions ->
#      Daily Realtime Database backup -> Run workflow) and confirm it
#      succeeds and the artifact actually contains real data - this was
#      never run against the real project during development, so verify it
#      before trusting it as your safety net.
#
# TO RESTORE from a backup: download the artifact from a past run (Actions
# -> this workflow -> pick a run -> Artifacts), then in Firebase Console ->
# Realtime Database -> the "..." menu -> Import JSON -> select the file.
# This OVERWRITES the live database with the backup's contents - only do
# this when you actually mean to roll the data back.
on:
  schedule:
    - cron: '17 3 * * *' # ~03:17 UTC daily - an off-the-hour time to avoid GitHub's on-the-hour scheduling congestion
  workflow_dispatch: {} # lets you trigger a manual backup/test run any time

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          scopes: https://www.googleapis.com/auth/firebase.database https://www.googleapis.com/auth/userinfo.email

      - name: Export the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -e
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set - see the setup instructions at the top of this workflow file."
            exit 1
          fi
          curl -sS -f -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$DATABASE_URL/.json?print=pretty" -o "db-backup-$(date +%Y-%m-%d).json"
          # fail loudly on an empty/near-empty export rather than silently
          # keeping a useless "backup" - a healthy export should be well
          # over this for a database with any real rooms/leaderboard data
          size=$(stat -c%s "db-backup-$(date +%Y-%m-%d).json" 2>/dev/null || stat -f%z "db-backup-$(date +%Y-%m-%d).json")
          echo "Backup size: $size bytes"
          if [ "$size" -lt 10 ]; then
            echo "::error::Backup looks empty/near-empty ($size bytes) - check the export before relying on it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: db-backup-*.json
          retention-days: 90
